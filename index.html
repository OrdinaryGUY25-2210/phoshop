<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e1e1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PS Lite — Editor Foto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="menubar">
    <div class="brand">PS<span>Lite</span></div>
    <div id="menus"></div>
    <button id="panel-toggle" class="menubtn" title="Buka/Tutup Panel">☰ Panel</button>
  </div>

  <div id="optionsbar"></div>

  <div id="main">
    <div id="toolbar">
      <div id="tool-buttons"></div>
      <div id="color-stack">
        <div id="fg-swatch" title="Warna Depan"></div>
        <div id="bg-swatch" title="Warna Belakang"></div>
        <button id="swap-colors" title="Tukar Warna (X)">⇄</button>
      </div>
    </div>

    <div id="viewport">
      <canvas id="view"></canvas>
      <div id="empty-hint">
        <div class="eh-inner">
          <div class="eh-logo">PS<span>Lite</span></div>
          <p>Editor foto gaya Photoshop<br>Buka gambar dari <b>Berkas → Buka</b> atau seret file ke sini</p>
        </div>
      </div>
    </div>

    <aside id="panels">
      <section class="panel">
        <h3>Warna</h3>
        <div class="panel-body" id="color-body">
          <div class="color-row">
            <div class="swatch-pair">
              <div id="fg-swatch2" class="swatch big"></div>
              <div id="bg-swatch2" class="swatch big behind"></div>
            </div>
            <div class="color-inputs">
              <input type="color" id="color-input" value="#000000" title="Pilih warna">
              <input type="text" id="hex-input" value="#000000" maxlength="7" title="Kode hex">
            </div>
          </div>
          <div id="palette" class="palette"></div>
        </div>
      </section>

      <section class="panel">
        <h3>Penyesuaian &amp; Filter</h3>
        <div class="panel-body">
          <div id="adjust-grid" class="btn-grid"></div>
        </div>
      </section>

      <section class="panel panel-layers">
        <h3>Lapisan</h3>
        <div class="panel-body">
          <div class="layer-controls">
            <select id="blend-select" title="Mode gabungan">
              <option value="source-over">Normal</option>
              <option value="multiply">Multiply</option>
              <option value="screen">Screen</option>
              <option value="overlay">Overlay</option>
              <option value="darken">Darken</option>
              <option value="lighten">Lighten</option>
              <option value="color-dodge">Color Dodge</option>
              <option value="color-burn">Color Burn</option>
              <option value="hard-light">Hard Light</option>
              <option value="soft-light">Soft Light</option>
              <option value="difference">Difference</option>
              <option value="exclusion">Exclusion</option>
              <option value="hue">Hue</option>
              <option value="saturation">Saturation</option>
              <option value="color">Color</option>
              <option value="luminosity">Luminosity</option>
            </select>
            <label class="opacity-label">Opasitas <span id="layer-op-val">100%</span>
              <input type="range" id="layer-opacity" min="0" max="100" value="100">
            </label>
          </div>
          <div id="layer-list"></div>
          <div class="layer-actions">
            <button id="layer-new" title="Lapisan baru">＋</button>
            <button id="layer-dup" title="Duplikat lapisan">⧉</button>
            <button id="layer-merge" title="Gabung ke bawah (Ctrl+E)">⤵</button>
            <button id="layer-up" title="Naikkan">▲</button>
            <button id="layer-down" title="Turunkan">▼</button>
            <button id="layer-del" title="Hapus lapisan">✕</button>
          </div>
        </div>
      </section>

      <section class="panel panel-history">
        <h3>Riwayat</h3>
        <div class="panel-body">
          <div id="history-list"></div>
        </div>
      </section>
    </aside>
  </div>

  <div id="statusbar">
    <span id="st-zoom">100%</span>
    <span id="st-size">800 × 600 px</span>
    <span id="st-layer">Layer 1</span>
    <span id="st-tool">Kuas</span>
    <span id="st-pos"></span>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>
<input type="file" id="file-input" accept="image/*" hidden>
<input type="file" id="proj-input" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
